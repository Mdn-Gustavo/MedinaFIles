[colors]
; Fundo preto profundo para sumir com a barra no wallpaper
background = #050505
; Texto principal (Branco acinzentado)
foreground = #e0e0e0
; Cinza médio-claro para CPU, RAM, VOL e BAT ficarem legíveis
prefix-gray = #888888
; Cinza escuro para itens inativos ou vazios
gray = #444444
; Destaque para o workspace atual
focused-bg = #222222

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 22pt
radius = 0
background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt
padding-left = 1
padding-right = 1
module-margin = 1

; Usa a JetBrainsMono que você já tem no Alacritty
font-0 = "JetBrainsMono Nerd Font:size=10;2"
font-1 = "Font Awesome 6 Free:style=Solid:size=10;2"

# Esta é a nova fonte para o "aesthetic" (itálica e pequena)
font-2 = "JetBrainsMono Nerd Font:style=Italic:size=8;2"

; Organização: i3 na esquerda, Tempo no meio, Stats na direita
modules-left = i3 sep xwindow sep music
modules-center = date
modules-right = cpu memory pulseaudio battery tray


tray-position = right 

; @deprecated in favor of new tray module since version 3.7.0
; If true, the bar will not shift its
; contents when the tray changes
tray-detached = false

; @deprecated in favor of new tray module since version 3.7.0
; Tray icon max size
tray-maxsize = 16

; @deprecated Since 3.3.0 the tray always uses pseudo-transparency
; Enable pseudo transparency
; Will automatically be enabled if a fully transparent
; background color is defined using `tray-background`
tray-transparent = false

; @deprecated in favor of new tray module since version 3.7.0
; Background color for the tray container 
; ARGB color (e.g. #f00, #ff992a, #ddff1023)
; By default the tray container will use the bar
; background color.
tray-background = ${root.background}

; @deprecated in favor of new tray module since version 3.7.0
; Foreground color for the tray icons
; This only gives a hint to the tray icon for its color, it will probably only
; work for GTK3 icons (if at all) because it targets a non-standard part of the
; system tray protocol by setting the _NET_SYSTEM_TRAY_COLORS atom on the tray
; window.
; New in version 3.6.0
tray-foreground = ${root.foreground}

; @deprecated in favor of new tray module since version 3.7.0
; Offset the tray in the x and/or y direction
; Supports any percentage with offset
; Percentages are relative to the monitor width or height for detached trays
; and relative to the bar window (without borders) for non-detached tray.
tray-offset-x = 0
tray-offset-y = 0

; @deprecated in favor of new tray module since version 3.7.0
; Pad the sides of each tray icon
tray-padding = 0

; @deprecated in favor of new tray module since version 3.7.0
; Scale factor for tray clients
tray-scale = 1.0

cursor-click = pointer

[module/sep]
type = custom/text
content = "|"
content-foreground = ${colors.gray}
content-padding = 1

[module/i3]
type = internal/i3
format = <label-state> <label-mode>
index-sort = true
wrapping-scroll = false
pin-workspaces = true

; Workspace focado (onde você está agora)
label-focused = %index%
label-focused-background = ${colors.focused-bg}
label-focused-underline = ${colors.prefix-gray}
label-focused-padding = 2

; Workspaces com janelas em outros monitores (se houver)
label-visible = %index%
label-visible-padding = 2

; Workspaces sem janelas (vazios)
label-unfocused = %index%
label-unfocused-foreground = ${colors.gray}
label-unfocused-padding = 2

; Workspace com alerta (ex: Discord apitando)
label-urgent = %index%
label-urgent-background = #bd2c40
label-urgent-padding = 2

[module/xwindow]
type = internal/xwindow
label = %title%
label-maxlen = 30
# Adicione esta linha:
label-font = 3
label-foreground = ${colors.primary}
label-padding = 1

[module/date]
type = internal/date
interval = 1
date = %H:%M
label = %date%
label-foreground = ${colors.foreground}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.prefix-gray}
label = %percentage%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.prefix-gray}
label = %percentage_used%%

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.prefix-gray}
format-volume = <label-volume>
label-volume = %percentage%%
label-muted = "MUTED"
label-muted-foreground = ${colors.gray}

[module/battery]
type = internal/battery
full-at = 99
low-at = 10
battery = BAT0
adapter = ADP1
format-charging = <label-charging>
format-discharging = <label-discharging>
format-prefix = "BAT "
format-prefix-foreground = ${colors.prefix-gray}
label-charging = "⚡ %percentage%%"
label-discharging = "%percentage%%"

[module/music]
type = custom/script
tail = true
interval = 1
# O comando abaixo pega o Artista - Título e limita a 30 caracteres para não quebrar sua barra
exec = playerctl metadata --format "{{ artist }} - {{ title }}" | cut -c1-30
# Ícone de música antes do texto
format-prefix = "󰎆 "
format-prefix-foreground = ${colors.prefix-gray}
label = %output%
label-font = 3
label-padding = 1

# Comandos para clicar na barra:
click-left = playerctl play-pause
scroll-up = playerctl next
scroll-down = playerctl previous


[module/tray]
Type = internal/tray
format-margin = 8
tray-spacing = 8
